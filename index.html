    </div>

    </div>

      <div id="reviewList"></div>
    </div>

      <button class="btn btn-primary" id="btnRetry" style="flex:2;">다시 풀기</button>
    </div>
  </section>

</div>

    "'길에 서다'의 '서다'는 길에 멈춰 선다는 의미이지, 떠난다는 의미가 아니다."
  ]
},
{
  id: 120,
  type: "다의어",
  question: "다음 중 '가다'의 의미가 나머지와 다른 하나는?",
  choices: [
    "학교에 가다.",
    "시간이 가다.",
    "집에 가다.",
    "회사에 가다.",
    "시장에 가다."
  ],
  answer: 1,
  explanations: [
    "'(장소로) 이동하다'는 의미로 쓰였다.",
    "'(시간이) 흐르다'는 의미로 쓰였으므로 나머지 넷과 의미가 다르다. ← 정답",
    "'(장소로) 이동하다'는 의미로 쓰였다.",
    "'(장소로) 이동하다'는 의미로 쓰였다.",
    "'(장소로) 이동하다'는 의미로 쓰였다."
  ]
}
];

/* ============ 설정 ============ */
const SESSION_N = 20;                 // 회당 출제 문항 수
const QUOTA = {                        // 회당 유형별 출제 할당
  "문맥 추론": 6, "한자어": 4, "고사성어": 3,
  "맞춤법": 3, "의미 관계": 2, "다의어": 2
};
const TYPES = ["문맥 추론", "한자어", "고사성어", "맞춤법", "의미 관계", "다의어"];
const STORE_KEY = "korean_vocab_quiz_v1";
const BY_ID = {};
BANK.forEach(q => { BY_ID[q.id] = q; });

/* ============ 상태 ============ */
let sessionQs = [];        // 이번 회차에 출제된 20문항
let currentIdx = 0;
let answers = new Array(SESSION_N).fill(-1);
let currentName = "";

/* ============ 유틸 ============ */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function underlineQuotedInPassage(passage, question) {
  let html = escapeHtml(passage);
  const quotes = [];
  const re = /['"‘’“”]([^'"‘’“”]+)['"‘’“”]/g;
  let m;
  while ((m = re.exec(question)) !== null) quotes.push(m[1]);
  quotes.forEach(q => {
    if (!q) return;
    const eq = escapeHtml(q);
    const idx = html.indexOf(eq);
    if (idx !== -1) html = html.slice(0, idx) + '<u class="hl-u">' + eq + '</u>' + html.slice(idx + eq.length);
  });
  return html;
}
function underlineNegatives(text) {
  return escapeHtml(text).replace(/(않[가-힣]*)/g, '<u class="hl-u">$1</u>');
}
/* 선택지에 나오는 '...' 인용구에도 밑줄 (밑줄 친 어휘/부분 문항용) */
function hlQuotes(text) {
  return escapeHtml(text).replace(/['"‘’“”]([^'"‘’“”]+)['"‘’“”]/g, '<u class="hl-u">$1</u>');
}

/* ============ 저장소 (이름별: attempts + wrong 오답 목록) ============ */
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveStore(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
}
/* 구버전(배열) 저장 형식을 신버전({attempts, wrong})으로 마이그레이션 */
function getUser(name) {
  const s = loadStore();
  let u = s[name];
  if (Array.isArray(u)) u = { attempts: u, wrong: [] };
  if (!u || typeof u !== "object") u = { attempts: [], wrong: [] };
  if (!Array.isArray(u.attempts)) u.attempts = [];
  if (!Array.isArray(u.wrong)) u.wrong = [];
  u.wrong = u.wrong.filter(id => BY_ID[id]);
  return u;
}
function saveUser(name, u) {
  const s = loadStore();
  s[name] = u;
  saveStore(s);
}

/* ============ 출제: 미해결 오답 최대 10개 우선 + 유형별 랜덤 ============ */
function selectQuestions(name) {
  const u = getUser(name);
  const wrongFirst = shuffle(u.wrong.slice()).slice(0, 10);
  const selected = [];
  const used = new Set();
  wrongFirst.forEach(id => {
    const q = BY_ID[id];
    if (q && !used.has(id)) { selected.push(q); used.add(id); }
  });
  const typeCount = {};
  TYPES.forEach(t => typeCount[t] = 0);
  selected.forEach(q => typeCount[q.type]++);
  TYPES.forEach(t => {
    const need = Math.max(0, QUOTA[t] - typeCount[t]);
    const pool = shuffle(BANK.filter(q => q.type === t && !used.has(q.id)));
    for (let i = 0; i < need && i < pool.length; i++) {
      selected.push(pool[i]);
      used.add(pool[i].id);
    }
  });
  return shuffle(selected);
}

/* ============ 화면 전환 ============ */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

/* ============ 퀴즈 진행 ============ */
function startQuiz() {
  const name = document.getElementById("nameInput").value.trim();
  if (!name) { alert("이름을 입력해주세요."); return; }
  currentName = name;
  sessionQs = selectQuestions(name);
  currentIdx = 0;
  answers = new Array(SESSION_N).fill(-1);
  buildNav();
  renderQuestion();
  showScreen("screen-quiz");
  document.getElementById("navPanel").classList.remove("open");
  document.getElementById("btnNavToggle").textContent = "문항 목록 보기";
}
function buildNav() {
  const grid = document.getElementById("navGrid");
  grid.innerHTML = "";
  sessionQs.forEach((q, i) => {
    const b = document.createElement("button");
    b.className = "nav-btn";
    b.textContent = i + 1;
    b.onclick = () => { currentIdx = i; renderQuestion(); };
    b.id = "nav" + i;
    grid.appendChild(b);
  });
}
function updateNav() {
  sessionQs.forEach((q, i) => {
    const b = document.getElementById("nav" + i);
    if (!b) return;
    b.className = "nav-btn" + (answers[i] !== -1 ? " answered" : "") + (i === currentIdx ? " current" : "");
  });
  const answered = answers.filter(a => a !== -1).length;
  document.getElementById("qAnswered").textContent = "답안 " + answered + "개";
  document.getElementById("progressFill").style.width = (answered / SESSION_N * 100) + "%";
}
function renderQuestion() {
  const q = sessionQs[currentIdx];
  document.getElementById("qProgress").textContent = (currentIdx + 1) + " / " + SESSION_N;
  document.getElementById("qTypeTag").textContent = q.type;
  const pv = document.getElementById("qPassage");
  if (q.passage) {
    pv.style.display = "block";
    pv.innerHTML = underlineQuotedInPassage(q.passage, q.question);
  } else {
    pv.style.display = "none";
    pv.innerHTML = "";
  }
  document.getElementById("qText").innerHTML = underlineNegatives(q.question);
  const ul = document.getElementById("choices");
  ul.innerHTML = "";
  q.choices.forEach((c, i) => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.className = "choice" + (answers[currentIdx] === i ? " selected" : "");
    btn.innerHTML = '<span class="num">' + (i + 1) + '.</span><span>' + hlQuotes(c) + "</span>";
    btn.onclick = () => { answers[currentIdx] = i; renderQuestion(); };
    li.appendChild(btn);
    ul.appendChild(li);
  });
  updateNav();
}

/* ============ 제출·채점 ============ */
function calcLevel(score) {
  if (score >= 90) return { name: "특급", desc: "어휘 마스터! 어떤 지문에서도 흔들리지 않겠어요." };
  if (score >= 70) return { name: "상급", desc: "탄탄한 어휘력! 어려운 어휘 몇 개만 보완하면 완벽해요." };
  if (score >= 50) return { name: "중급", desc: "기본 어휘는 갖췄어요. 한자어·고사성어를 보강해 보세요." };
  return { name: "초급", desc: "기초부터 차근차근! 매일 10개씩 어휘를 익혀 보세요." };
}
function submitQuiz() {
  const unanswered = answers.filter(a => a === -1).length;
  if (unanswered > 0 && !confirm("아직 " + unanswered + "문항에 답하지 않았습니다. 그래도 제출할까요?")) return;
  const perQ = answers.map((a, i) => a === sessionQs[i].answer);
  const correct = perQ.filter(Boolean).length;
  const score = Math.round(correct / SESSION_N * 100);
  const level = calcLevel(score);
  const typeStats = {};
  TYPES.forEach(t => typeStats[t] = { c: 0, n: 0 });
  sessionQs.forEach((q, i) => {
    typeStats[q.type].n++;
    if (perQ[i]) typeStats[q.type].c++;
  });

  /* 오답 관리: 틀리면 미해결에 추가, 맞히면 해결(제거) */
  const u = getUser(currentName);
  const wrongSet = new Set(u.wrong);
  const sessionIds = sessionQs.map(q => q.id);
  const wrongIdsThis = sessionIds.filter((id, i) => !perQ[i]);
  wrongIdsThis.forEach(id => wrongSet.add(id));
  let resolved = 0;
  sessionIds.forEach((id, i) => {
    if (perQ[i] && wrongSet.has(id)) { wrongSet.delete(id); resolved++; }
  });
  u.wrong = Array.from(wrongSet);
  u.attempts.push({
    date: new Date().toISOString(),
    score, level: level.name, correct,
    typeStats, qids: sessionIds, answers: perQ
  });
  saveUser(currentName, u);

  renderResult(perQ, correct, score, level, typeStats, wrongIdsThis.length, resolved, u.wrong.length);
  showScreen("screen-result");
}

/* ============ 결과 렌더 ============ */
function renderResult(perQ, correct, score, level, typeStats, newWrong, resolved, remaining) {
  document.getElementById("scoreNum").textContent = score;
  document.getElementById("levelName").textContent = level.name;
  document.getElementById("levelDesc").textContent = level.desc;
  document.getElementById("scoreDetail").textContent = SESSION_N + "문항 중 " + correct + "문항 정답";
  document.getElementById("wrongStatusResult").innerHTML =
    "오답 복습 현황 · 이번에 새로 틀린 문제 <b>" + newWrong + "</b>개 · " +
    "다시 맞혀 해결한 문제 <b>" + resolved + "</b>개 · 미해결 오답 <b>" + remaining + "</b>개";

  const ts = document.getElementById("typeStats");
  ts.innerHTML = "";
  TYPES.forEach(t => {
    const s = typeStats[t];
    const pct = s.n ? Math.round(s.c / s.n * 100) : 0;
    const div = document.createElement("div");
    div.className = "type-stat";
    div.innerHTML = '<div class="row"><span>' + t + '</span><span><b>' + s.c + "/" + s.n + '</b> (' + pct + '%)</span></div>' +
      '<div class="type-bar"><div class="type-fill" style="width:' + pct + '%"></div></div>';
    ts.appendChild(div);
  });
  document.getElementById("resultComment").textContent = buildComment(typeStats);

  const rl = document.getElementById("reviewList");
  rl.innerHTML = "";
  sessionQs.forEach((q, i) => {
    const div = document.createElement("div");
    div.className = "review-item";
    let html = '<div class="review-q">Q' + (i + 1) + '. <span class="tag">' + q.type + '</span>' +
      '<span class="review-mark ' + (perQ[i] ? "mark-o" : "mark-x") + '">' + (perQ[i] ? "O" : "X") + "</span></div>";
    if (q.passage) html += '<div class="passage">' + underlineQuotedInPassage(q.passage, q.question) + "</div>";
    html += '<div class="qtext" style="font-size:0.97rem;">' + underlineNegatives(q.question) + "</div>";
    q.choices.forEach((c, ci) => {
      let cls = "choice dim";
      if (ci === q.answer) cls = "choice correct";
      else if (answers[i] === ci) cls = "choice wrong";
      html += '<div class="' + cls + '" style="cursor:default; margin-bottom:6px;"><span class="num">' + (ci + 1) + '.</span><span>' + hlQuotes(c) + "</span></div>";
    });
    html += '<div class="expl"><span class="en">정답: ' + (q.answer + 1) + '번</span><br>' + q.explanations.map((e, ei) => (ei + 1) + ". " + escapeHtml(e)).join("<br>") + "</div>";
    div.innerHTML = html;
    rl.appendChild(div);
  });
}
function buildComment(typeStats) {
  const weak = TYPES.filter(t => {
    const s = typeStats[t];
    return s.n > 0 && s.c / s.n < 0.6;
  });
  if (weak.length === 0) return "모든 유형에서 고른 실력을 보였어요! 이 페이스를 유지하세요.";
  return "보완이 필요한 유형: " + weak.join(", ") + ". 해설을 다시 읽고 관련 어휘를 정리해 보세요.";
}

/* ============ 시작 화면 기록 ============ */
function renderHistoryPanel(name) {
  const u = getUser(name);
  const history = u.attempts;
  const panel = document.getElementById("historyPanel");
  if (!history.length) { panel.style.display = "none"; return; }
  panel.style.display = "block";
  document.getElementById("historyTitle").textContent = name + "님의 기록";

  const last = history[history.length - 1];
  const prev = history.length > 1 ? history[history.length - 2] : null;
  const td = document.getElementById("trendDelta");
  if (prev) {
    const diff = last.score - prev.score;
    const cls = diff > 0 ? "delta-up" : diff < 0 ? "delta-down" : "delta-flat";
    const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "━";
    td.innerHTML = '최근 점수 <b>' + last.score + '</b>점 · 이전 대비 <span class="' + cls + '">' + arrow + " " + Math.abs(diff) + "점</span>";
  } else {
    td.innerHTML = "최근 점수 <b>" + last.score + "</b>점 · 첫 응시 기록입니다.";
  }
  document.getElementById("wrongStatus").innerHTML =
    "오답 복습 현황 · 미해결 오답 <b>" + u.wrong.length + "</b>개 (다음 응시에서 최대 10개 우선 출제)";

  document.getElementById("trendGraph").innerHTML = buildTrendSVG(history);

  const hl = document.getElementById("historyList");
  hl.innerHTML = "";
  history.slice().reverse().forEach((h, ri) => {
    const d = new Date(h.date);
    const ds = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + " " +
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    const div = document.createElement("div");
    div.className = "hist-item";
    div.innerHTML = "<span>" + (history.length - ri) + "회차 · " + ds + " · " + h.level + "</span>" +
      '<span class="hist-score">' + h.score + "점</span>";
    hl.appendChild(div);
  });

  const agg = {};
  TYPES.forEach(t => agg[t] = { c: 0, n: 0 });
  history.forEach(h => {
    TYPES.forEach(t => {
      if (h.typeStats && h.typeStats[t]) { agg[t].c += h.typeStats[t].c; agg[t].n += h.typeStats[t].n; }
    });
  });
  const ta = document.getElementById("typeAnalysis");
  ta.innerHTML = "";
  TYPES.forEach(t => {
    const s = agg[t];
    const pct = s.n ? Math.round(s.c / s.n * 100) : 0;
    const div = document.createElement("div");
    div.className = "type-stat";
    div.innerHTML = '<div class="row"><span>' + t + '</span><span><b>' + s.c + "/" + s.n + '</b> (' + pct + '%)</span></div>' +
      '<div class="type-bar"><div class="type-fill" style="width:' + pct + '%"></div></div>';
    ta.appendChild(div);
  });
  document.getElementById("analysisComment").textContent = buildComment(agg);
}
function buildTrendSVG(history) {
  const W = 640, H = 220, PL = 40, PR = 16, PT = 18, PB = 34;
  const iw = W - PL - PR, ih = H - PT - PB;
  const n = history.length;
  const xs = i => n === 1 ? PL + iw / 2 : PL + iw * i / (n - 1);
  const ys = s => PT + ih * (1 - s / 100);
  let grid = "";
  [0, 25, 50, 75, 100].forEach(v => {
    const y = ys(v);
    grid += '<line x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y + '" stroke="#e3e6eb" stroke-width="1"/>' +
      '<text x="' + (PL - 6) + '" y="' + (y + 4) + '" font-size="11" fill="#888" text-anchor="end">' + v + "</text>";
  });
  let pts = "", dots = "", labels = "";
  history.forEach((h, i) => {
    const x = xs(i).toFixed(1), y = ys(h.score).toFixed(1);
    pts += (i ? " " : "") + x + "," + y;
    dots += '<circle cx="' + x + '" cy="' + y + '" r="5" fill="#0f2a5c"/>' +
      '<text x="' + x + '" y="' + (y - 10) + '" font-size="12" font-weight="bold" fill="#0f2a5c" text-anchor="middle">' + h.score + "</text>";
    labels += '<text x="' + x + '" y="' + (H - 12) + '" font-size="11" fill="#888" text-anchor="middle">' + (i + 1) + "회</text>";
  });
  const line = n === 1
    ? '<circle cx="' + xs(0).toFixed(1) + '" cy="' + ys(history[0].score).toFixed(1) + '" r="5" fill="#0f2a5c"/>'
    : '<polyline points="' + pts + '" fill="none" stroke="#0f2a5c" stroke-width="2.5"/>';
  return '<svg class="graph" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="점수 추이 그래프">' +
    grid + line + dots + labels + "</svg>";
}

/* ============ 이벤트 ============ */
document.getElementById("btnStart").onclick = startQuiz;
document.getElementById("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") startQuiz(); });
document.getElementById("nameInput").addEventListener("input", e => {
  const n = e.target.value.trim();
  if (n) renderHistoryPanel(n); else document.getElementById("historyPanel").style.display = "none";
});
document.getElementById("btnPrev").onclick = () => { if (currentIdx > 0) { currentIdx--; renderQuestion(); } };
document.getElementById("btnNext").onclick = () => { if (currentIdx < SESSION_N - 1) { currentIdx++; renderQuestion(); } };
document.getElementById("btnNavToggle").onclick = () => {
  const p = document.getElementById("navPanel");
  p.classList.toggle("open");
  document.getElementById("btnNavToggle").textContent = p.classList.contains("open") ? "문항 목록 닫기" : "문항 목록 보기";
};
document.getElementById("btnSubmit").onclick = submitQuiz;
document.getElementById("btnHome").onclick = () => {
  renderHistoryPanel(currentName);
  showScreen("screen-start");
};
document.getElementById("btnRetry").onclick = () => {
  /* 새 회차: 오답 우선 + 랜덤으로 20문항을 다시 뽑는다 */
  sessionQs = selectQuestions(currentName);
  currentIdx = 0;
  answers = new Array(SESSION_N).fill(-1);
  buildNav();
  renderQuestion();
  showScreen("screen-quiz");
  document.getElementById("navPanel").classList.remove("open");
  document.getElementById("btnNavToggle").textContent = "문항 목록 보기";
};
</script>
